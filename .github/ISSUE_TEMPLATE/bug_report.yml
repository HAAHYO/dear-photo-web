name: 🐛 버그 리포트
description: 예상과 다르게 동작하는 부분을 알려주세요
title: "[bug] "
labels: ["🐛 bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 무슨 문제인가요?
      description: 어떤 버그인지 간단히 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 순서를 적어주세요.
      placeholder: |
        1. '...'로 이동
        2. '...' 클릭
        3. 에러 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대했던 동작
      description: 원래는 어떻게 동작해야 하나요?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Frontend
        - Backend
        - Infra / 배포
        - 알 수 없음
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브라우저/OS/디바이스, 배포 환경(로컬/스테이징/프로덕션) 등
      placeholder: |
        - 브라우저: Chrome 128
        - OS: Windows 11
        - 환경: local dev
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 / 로그 / 참고 링크
      description: 관련 스크린샷, 콘솔 로그, Swagger 응답 등을 붙여주세요.
    validations:
      required: false
